<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unicode Formatting Engine Test Runner</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    h1 {
      color: #0a66c2;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #4b5563;
      margin-bottom: 24px;
    }
    .summary-card {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .badge {
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;
    }
    .badge.passed {
      background-color: #10b981;
    }
    .badge.failed {
      background-color: #ef4444;
    }
    .test-list {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      overflow: hidden;
    }
    .test-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
    }
    .test-item:last-child {
      border-bottom: none;
    }
    .test-item.pass {
      background-color: #f0fdf4;
    }
    .test-item.fail {
      background-color: #fef2f2;
    }
    .test-name {
      font-weight: 500;
    }
    .test-status {
      font-weight: 700;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .test-item.pass .test-status {
      background-color: #d1fae5;
      color: #065f46;
    }
    .test-item.fail .test-status {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .details {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Unicode Formatting Engine Tests</h1>
    <p class="subtitle">Verifying 26 test cases for Bold, Italic, Bold Italic, Underline, and Double Underline.</p>
    
    <div class="summary-card">
      <div id="passed-badge" class="badge passed">Passed: 0</div>
      <div id="failed-badge" class="badge failed">Failed: 0</div>
    </div>
    
    <div id="test-list" class="test-list">
      <!-- Test items will be dynamically injected here -->
    </div>
  </div>

  <!-- Include source scripts -->
  <script src="../src/shared/constants.js"></script>
  <script src="../src/formatter/unicode-maps.js"></script>
  <script src="../src/formatter/text-normalizer.js"></script>
  <script src="../src/formatter/text-formatter.js"></script>
  <script src="./formatter.test.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Execute the test suite
      const summary = runTests();
      
      // Update badges
      document.getElementById('passed-badge').innerText = `Passed: ${summary.passed}`;
      document.getElementById('failed-badge').innerText = `Failed: ${summary.failed}`;
      
      // Render test cases
      const listContainer = document.getElementById('test-list');
      listContainer.innerHTML = '';
      
      summary.results.forEach(res => {
        const item = document.createElement('div');
        item.className = `test-item ${res.status.toLowerCase()}`;
        
        const infoDiv = document.createElement('div');
        
        const nameDiv = document.createElement('div');
        nameDiv.className = 'test-name';
        nameDiv.innerText = res.name;
        infoDiv.appendChild(nameDiv);
        
        const detailsDiv = document.createElement('div');
        detailsDiv.className = 'details';
        detailsDiv.innerText = `Expected: "${res.expected}" | Actual: "${res.actual}"`;
        infoDiv.appendChild(detailsDiv);
        
        item.appendChild(infoDiv);
        
        const statusSpan = document.createElement('span');
        statusSpan.className = 'test-status';
        statusSpan.innerText = res.status;
        item.appendChild(statusSpan);
        
        listContainer.appendChild(item);
      });
    });
  </script>
</body>
</html>
